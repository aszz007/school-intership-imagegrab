<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图提取 · 320px布局验收</title>
<style>body{margin:0;padding:24px;background:#eef0f6;color:#18213c;font:14px/1.7 system-ui,sans-serif}h1{font-size:22px}iframe{display:block;width:320px;height:844px;border:1px solid #bdc8df;background:white}p{max-width:700px}</style>
</head>
<body>
<h1>官网320px同源子视口验收</h1>
<p>此页面用于检查真实页面在320px宽度下的布局和交互，不是手机设备截图，也不是Chrome扩展运行截图。</p>
<iframe id="phone" title="320px官网预览" src="../index.html" width="320" height="844"></iframe>
<script>
const widths = [320, 375, 768];
const value = Number(new URLSearchParams(location.search).get("width"));
const width = widths.includes(value) ? value : 320;
const frame = document.getElementById("phone");
frame.style.width = width + "px";
frame.width = width;
frame.title = width + "px官网预览";
document.querySelector("h1").textContent = "官网" + width + "px同源子视口验收";
</script>
</body>
</html>
