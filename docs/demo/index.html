<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>图片画廊 · 图提取 ImageGrab</title><link rel="stylesheet" href="gallery.css"></head><body><header class="topbar"><a class="brand" href="#"><span class="brand-icon">↗</span><span>图提取<small>IMAGEGRAB</small></span></a><span id="mode-label" class="mode-label">商品图片画廊</span></header><main><div class="heading"><div><span class="eyebrow">YOUR IMAGES, YOUR PICK.</span><h1>先挑好，再下载。</h1><p id="source-title">正在读取商品图片…</p></div><div class="summary"><strong id="total">0</strong><span>张可选图片</span></div></div><p id="notice" class="notice" role="status" aria-live="polite">正在加载…</p><section class="toolbar" aria-label="图片选择与下载"><div class="selection-actions"><button id="select-all" type="button">全选</button><button id="invert" type="button">反选</button><button id="clear" type="button">取消选择</button><span>已选 <strong id="selected">0</strong> 张</span></div><div class="download-actions"><button id="cancel" type="button" hidden>停止后续下载</button><button id="download" class="primary" type="button" disabled>下载选中 · PNG <span>↓</span></button></div></section><div id="progress" class="progress" hidden><progress id="progress-bar" value="0" max="1"></progress><p id="progress-text" role="status"></p></div><section id="gallery" class="gallery" aria-label="提取的图片"></section><div id="empty" class="empty" hidden><h2>还没有可用图片</h2><p>回到商品页，等待图片加载后重新获取。</p></div><details id="results" class="results" hidden><summary>下载处理记录</summary><ul id="result-list"></ul></details><footer><p>支持已加载的商品图与常见图片格式，动态图片保存为静态帧。小于100×100像素的图片不会下载。</p><p>图片保留在本机；下载前只请求选中图片源的权限。请保存有权使用的图片。</p></footer></main><script src="shared/core.js"></script><script src="gallery.js"></script></body></html>
